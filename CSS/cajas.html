<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejemplo selectores</title>
    <link rel="stylesheet" href="cajas.css">
</head>

<body>
    <div class="contenedor">
        <div class="caja-normal">
            Este es un div normal. Ocupa todo el ancho disponible.
        </div>

        <div class="caja-max-content">
            Yo uso <strong>max-content</strong> y me expando sin importar nada.
        </div>

        <div class="caja-min-content">
            Yo uso <strong>min-content</strong> y mi ancho lo define mi palabra más larga.
        </div>
    </div>
</body>

</html>
